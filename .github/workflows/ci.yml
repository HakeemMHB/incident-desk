name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (unit + integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: incidents
          POSTGRES_USER: incidents
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U incidents -d incidents"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      INTEGRATION_TESTS: "1"
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: ci-only-password
      REDIS_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  compose:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack exactly as the README says
        run: docker compose up -d --build --wait

      - name: Both databases answer
        run: curl -fsS http://localhost:8000/readyz

      - name: A valid report is accepted
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -d "title=CI smoke test&category=other&severity=low&description=Automated check" \
            http://localhost:8000/)
          test "$code" = "303"

      - name: The report is in PostgreSQL and in Redis
        run: |
          test "$(docker compose exec -T postgres psql -U incidents -d incidents -tAc 'SELECT count(*) FROM reports')" = "1"
          test "$(docker compose exec -T redis redis-cli LLEN incidents:recent)" = "1"

      - name: Data survives a restart
        run: |
          docker compose down
          docker compose up -d --wait
          test "$(docker compose exec -T postgres psql -U incidents -d incidents -tAc 'SELECT count(*) FROM reports')" = "1"
          test "$(docker compose exec -T redis redis-cli LLEN incidents:recent)" = "1"

      - name: The application does not run as root
        run: test "$(docker compose exec -T app whoami)" = "app"

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Clean up
        if: always()
        run: docker compose down -v
