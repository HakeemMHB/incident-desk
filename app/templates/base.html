<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Incident Desk{% endblock %} · Incident Desk</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('show_form') }}">
      <span class="brand-mark" aria-hidden="true"></span>Incident Desk
    </a>
    <nav>
      <a href="{{ url_for('show_form') }}"{% if request.url.path == '/' %} aria-current="page"{% endif %}>Report</a>
      <a href="{{ url_for('show_reports') }}"{% if request.url.path == '/reports' %} aria-current="page"{% endif %}>Dashboard</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">FastAPI · PostgreSQL · Redis · Docker Compose</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
